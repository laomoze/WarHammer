unit.wh-mecha3.description = 中型机甲，火力与装甲均衡。
unit.wh-mecha3.details = 战团主力机甲，能在巷战中长时间压制。

unit.wh-mecha4.name = 死灭
unit.wh-mecha4.description = 重型机甲，专司破城与攻坚。
unit.wh-mecha4.details = 以重炮撕开城防，机魂冷酷不知怜悯。

unit.wh-mecha5.name = 护卫侍从
unit.wh-mecha5.description = 侍从级机甲，强化近战与护卫。
