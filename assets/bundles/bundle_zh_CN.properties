wh.moddetail.settings.title = Mod Introduction
wh.moddetail.settings.subtitle = 模组设定介绍
wh.moddetail.settings.text = [lightgray]赛普罗与埃里克尔原本是帝国先遣调查链中的外围节点，用于确认这片星域中远古工业遗迹网络的存在。两地遗迹层级有限、技术残损严重，因此帝国最初并未意识到更深处隐藏着真正的兵工核心。[]\n\
• 顺着遗迹信号与古代航道继续推进后，先遣队将目标锁定在工业星球卡维克斯。然而帝国对局势作出了错误判断，只派遣了小规模侦察部队、技术神甫、驻防力量和本地忠诚派守军先行进入调查。\n\
• 卡维克斯表面上是稳定运作的重工业世界，实际上却长期承受超额军工压榨，内部统治阶层又因地下遗迹开发权爆发激烈内斗。随着深层勘探展开，部分人员遭受禁忌数据与受污染机魂腐化，原本压抑的社会矛盾迅速失控。\n\
• 在厄兆方舟战争余波中，源自钢铁勇士系的灾厄战帮截获了卡维克斯的情报，并趁机扶植本地叛乱派系，将零散暴动整合为全面工业战争。帝国先遣队各部被切割困守，只能在失控的工业区中苦苦支撑并呼叫增援。\n\
• 为防止卡维克斯深层远古兵工核心落入混沌之手，帝国最终派出以机械化攻坚著称的征服者战团投入战场，展开对这颗钢铁世界的全面收复作战。\n\
[accent]征服者战团[]是一支以机械化推进、装甲突破和重火力协同闻名的帝国阿斯塔特战团。\n\
• 他们不依赖快速奇袭，而是强调装甲洪流、重炮阵地、轨道压制和成建制推进。\n\
• 战团习惯与大量凡人辅助军、装甲团、工程兵和机修神甫联合行动，通过稳步扩张火力覆盖和前进基地来碾碎敌军。\n\
[accent]灾厄战帮[]是一支源自钢铁勇士系的混沌战帮，其核心由攻城老兵、战争铁匠、重火力部队、奴工营以及被腐化的机械单位构成。与那些沉迷狂乱屠杀的混沌势力不同，灾厄战帮保留了极强的工程纪律、攻城传统与工业组织能力。\n\
• 他们最擅长的不是迅速摧毁一座城市，而是将整座城市转化为自己的战争机器。壕沟、防空巢穴、火炮平台、装甲壁垒和污染熔炉会在他们占领的土地上迅速生长，把战场改造成一片持续运转的围城炼狱。\n\
• 在厄兆方舟战争余波中，灾厄战帮从破碎战线中脱离，并截获了关于卡维克斯深层遗迹的情报。他们很快意识到，这颗工业星球真正的价值并不在现成工厂，而在埋藏于地下的远古兵工复合体。只要掌控那里，他们就能将卡维克斯重铸为一座新的混沌铸造堡垒。
