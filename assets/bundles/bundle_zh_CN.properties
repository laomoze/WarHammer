unit.wh-c-moon.details = 新月遮天而至，机魂以雷暴审判一切。

unit.wh-mecha2.name = 哨兵
unit.wh-mecha2.description = 轻型机甲，机动巡逻与警戒。
unit.wh-mecha2.details = 如哨兵般守护战线，是步兵的钢铁屏障。

