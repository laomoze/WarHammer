unit.wh-airB3.name = 铁锤
unit.wh-airB3.description = 工程辅助战斗机
unit.wh-airB3.details = 装备小型维修机，可在战地环境抢修友军单位

unit.wh-airB4.name = 铜楔
unit.wh-airB4.description = 装甲运兵艇，可装载并投送中型载荷
unit.wh-airB4.details = 在放下友军之前至少得活下来

unit.wh-airB5.name = 钢岭
unit.wh-airB5.description = 特种巡护机，快速修复大范围内的受损友军单位
unit.wh-airB5.details = 妥善保护机体中央的亚原子核心

unit.wh-airB6.name = 雷鹰
unit.wh-airB6.description = 重装甲炮艇，地面部队最可靠的后盾
unit.wh-airB6.details = 在放下友军后顺手把帝国的敌人送上天也未尝不可
