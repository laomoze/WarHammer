#—Turrets—#

block.wh-sword.name = 利剑
block.wh-sword.description = 四联导弹发射架，各阵地标准远程火力配置
block.wh-sword.details = 依靠惯性飞行一段距离后启动推进器与导引头，近距离下精度较差

block.wh-shard.name = 破片
block.wh-shard.description = 双管重霰弹炮，发射破穿弹粉碎前方直线上的敌人
block.wh-shard.details = 需要液体冷却以达到最大杀伤效率

block.wh-lancer.name = 兰瑟（测试）
block.wh-lancer.description = 测试用激光炮台。
block.wh-lancer.details=开发测试用炮塔，数值与机制可能随版本调整。
block.wh-test-sound-turret.name=音效炮塔（测试）
block.wh-test-sound-turret.description=用于测试不同弹药开火音效的实验炮塔。
block.wh-test-sound-turret.details=仅用于弹药开火音效验证，不建议正式战局使用。

block.wh-hector.name = 赫克托
block.wh-hector.description = 极少数被允许在地面部署的宏炮系统，对地面目标有极强的破坏力
block.wh-hector.details = 必须装配巨大尺寸的实验型自动复进系统使用，开火速度尚有提升空间

block.wh-mezoa.name = 梅佐阿
block.wh-mezoa.description = 三联装光矛，牺牲伤害换取更大的范围
block.wh-mezoa.details=覆盖面积更大，适合对密集敌群进行范围清场。
block.wh-Ray.name = 射线
block.wh-Ray.description = 镭射炮塔，发射高冲击弹药打击前线目标。
block.wh-Ray.details=连续点射稳定，适合压制中小型地面单位。
block.wh-Spike.name = 尖刺
block.wh-Spike.description = 轻型双管机炮，适合前期快速压制。
block.wh-Spike.details=造价低、转速快，是开局防线的基础火力。
block.wh-Auto-gun.name = 自动枪序列
block.wh-Auto-gun.description = 固定式双联重型伐木枪，作为标准火力配置大量部署于各防线
block.wh-Auto-gun.details = 历史悠久的重型武器，易于建造和维护，适配多种弹药，并且有百分之10的概率触发暴击
block.wh-S-sword.name = 利剑
block.wh-S-sword.description = 四联导弹发射架，各阵地标准远程火力配置
block.wh-S-sword.details = 依靠惯性飞行一段距离后启动推进器与导引头，近距离下精度较差
block.wh-Blaze.name = 炽热
block.wh-Blaze.description = 连续激光炮台，持续灼烧并压制中近距离目标，需要长时间预热。
block.wh-Blaze.details=需预热后输出显著提升，建议由前排吸引火力。
block.wh-Blade.name = 剑刃
block.wh-Blade.description = 多管近防炮台，快速倾泻火力清理中小型单位。
block.wh-Blade.details=近距火力密度高，对蜂拥目标压制效果最佳。
block.wh-Crush.name = 镇压
block.wh-Crush.description = PDF制式重型伐木枪，结构简单，造价低廉
block.wh-Crush.details = 数 量 压 制
block.wh-Lcarus.name = 伊卡洛斯
block.wh-Lcarus.description = 城防激光炮，可快速展开向中距离内目标发动连续定点打击
block.wh-Lcarus.details = 机械教的得意之作，自大远征时起便已经被帝国辅助军作为防御武器使用，至今仍大量装备于各星界军团。威力不俗，绝对可靠
block.wh-Prevent.name = 固守
block.wh-Prevent.description = 固定式双联重爆弹，高效清理中小型目标
block.wh-Prevent.details = 技术军士在某次防御战中将飓风爆弹炮紧急拆卸作为固定炮台使用，（被随军机械教贤者追着打了一顿）后对其进行改进并作为防御炮台部署于各阵地
block.wh-Deflection.name = 偏转
block.wh-Deflection.description = 重型拦截炮台，往敌人发射密集拦截子弹
block.wh-Deflection.details=对高速与轻甲单位有优秀拦截能力。
block.wh-Pyros.name = 炎火
block.wh-Pyros.description = 往敌人发射大熔岩炮弹，根据热量输入提升伤害
block.wh-Pyros.details=热量越高炮弹越致命，注意热管理与供热链路。
block.wh-Ionize.name = 电离
block.wh-Ionize.description = 小型电浆加农炮
block.wh-Ionize.details=附带电浆灼烧，适合补刀与持续压制。
block.wh-Vortex.name = 漩涡
block.wh-Vortex.description = 大型水枪，向敌人喷射高压液体
block.wh-Vortex.details=高压液束可扰动敌群推进节奏。
block.wh-Viper.name = 蝰蛇
block.wh-Viper.description = 往敌人发射散射激光，对前俩个目标造成更多伤害
block.wh-Viper.details=优先打击前序目标，适合快速斩杀关键单位。
block.wh-Heavy-hammer.name = 重锤
block.wh-Heavy-hammer.description = 以撼地炮为原型改装的部署式攻防两用火炮
block.wh-Heavy-hammer.details = 来自神皇的重锤将粉碎一切帝国的敌人
block.wh-Flash.name = 闪光
block.wh-Flash.description = 高准度定向电弧激发器，释放脉冲电弧束打击敌人
block.wh-Flash.details = 对接地建筑效果奇差且电耗极高，谨慎部署
block.wh-Roaring-flame.name = 烈焰
block.wh-Roaring-flame.description = 双管重型钷素喷火器，贯穿并净化焰刃触碰到的一切异端
block.wh-Roaring-flame.details = 原计划装配在帝皇级泰坦上的超重型喷火器，由于射程不及地狱炮而转为阵地防御装备
block.wh-Collapse.name = 崩溃
block.wh-Collapse.description = 先敌人发射电磁脉冲弹，范围内敌人会持续受伤并且施加瘫痪
block.wh-Collapse.details=EMP 区域可持续瘫痪目标，便于集火歼灭。
block.wh-Colossus.name = 巨像
block.wh-Colossus.description = 重型榴弹炮，爆炸后产生大量破片，对护盾伤害显著
block.wh-Colossus.details=大范围碎片洗地，对护盾和集群目标威胁极高。
block.wh-Sacrament.name = 圣礼
block.wh-Sacrament.description = 重型高精度轨道炮，对高价值目标实施远程打击。
block.wh-Sacrament.details=装填较慢但单发价值高，优先锁定重甲目标。
block.wh-Cyclone-missile-launcher.name = 旋风导弹发射器
block.wh-Cyclone-missile-launcher.description = 陆基重型导弹发射器，轰碎范围内一切敌人
block.wh-Cyclone-missile-launcher.details=依靠密集齐射覆盖大片区域。
block.wh-Crumble.name = 瓦解
block.wh-Crumble.description = 质子充能炮，击中后武器会过载一小段时间，对瘫痪下敌人额外造成一次等同伤害的穿甲伤害
block.wh-Crumble.details=命中后触发过载窗口，适合配合爆发火力连杀。
block.wh-Hydra.name = 九头蛇
block.wh-Hydra.description = 四连装高射炮，发射密集子弹
block.wh-Hydra.details=对空覆盖密度高，适合构建防空火网。
block.wh-Erase.name = 抹除
block.wh-Erase.description = 重型巨炮，专门针对重甲目标而设计
block.wh-Erase.details=穿甲能力强，专门压制高生命高护甲单位。
block.wh-Annihilate.name = 歼灭
block.wh-Annihilate.description = 重型等离子炮，爆炸后会产生等离子体对敌人产生持续伤害
block.wh-Annihilate.details=爆炸残留等离子区，可持续灼烧滞留目标。
block.wh-Melta.name = 热熔
block.wh-Melta.description = 发射热熔射线
block.wh-Melta.details=近距离热熔束对重甲单位威胁极大。
block.wh-Reckoning.name = 清算
block.wh-Reckoning.description = 重型远程炮台，具备强大的区域压制能力。
block.wh-Reckoning.details=后排远程压制火力，适合守线和区域封锁。
#—Defense Missing Bundle（按组归位）—#
block.wh-air-raider.name = 空袭突袭器
block.wh-air-raider.description = 战术空袭用的部署装置。
block.wh-air-raider.details=与空降召唤枢纽联动，可快速发起战术空袭。
block.wh-tactical-command-center.name = 战术指挥中心
block.wh-tactical-command-center.description = 用于战术调度与战区指令中继。
block.wh-tactical-command-center.details=用于联结战场指令、空袭与炮击调度。

#—Production—#
block.wh-scrap-crusher.name = 大型粉碎机
block.wh-scrap-crusher.description = 将废料粉碎为可处理原料。
block.wh-scrap-crusher.details=回收战场残骸与报废构件，为铸造线提供再生原料。
block.wh-manganese-steel-furnace.name = 锰钢熔炉
block.wh-manganese-steel-furnace.description = 用于冶炼锰钢。
block.wh-manganese-steel-furnace.details = 紧急开发的战时生产版本，效率远低于铸造世界的集成冶炼设施

block.wh-arc-kiln.name = 电弧窑炉
block.wh-arc-kiln.description = 利用电弧高效生产钢化玻璃
block.wh-arc-kiln.details = “启动前务必进行纳米熏香与祷告“

block.wh-multi-press.name = 多重压缩机
block.wh-multi-press.description = 高效率压制固体原料。
block.wh-multi-press.details=将松散原料压制成标准料块，便于前线工厂连续进料。
block.wh-silicon-mix-furnace.name = 大型混合硅炉
block.wh-silicon-mix-furnace.description=通用化硅生产设备
