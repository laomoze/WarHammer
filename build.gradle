import groovy.json.JsonSlurper

apply plugin: "java"

version = '1.0'

sourceSets.main.java.srcDirs = ["src"]

repositories{
    mavenCentral()
    maven{ url 'https://www.jitpack.io' }

    //Downloads the server-release JAR file from Mindustry releases; does not use any real repository. Surprisingly, this is the most reliable option.
    ivy{
        url 'https://github.com/'
        patternLayout{ artifact '/[organisation]/[module]/releases/download/[revision]/dependencies.jar' }
        metadataSources{ artifact() }
    }

    //"Latest" option to depend on BE builds.
    ivy{
        url 'https://github.com/'
        patternLayout{ artifact '/[organisation]/[module]/releases/download/master/[revision].jar' }
        metadataSources{ artifact() }
    }

    //Do the same with jabel
    ivy{
        url 'https://github.com/'
        patternLayout{ artifact '/[organisation]/[module]/releases/download/[revision]/jabel.jar' }
        metadataSources{ artifact() }
    }
}

java{
    targetCompatibility = 8
    sourceCompatibility = JavaVersion.VERSION_17
}

ext{
    mindustryVersion = (project.findProperty('mindustryVersion') ?: '158').toString()
    jabelVersion = (project.findProperty('jabelVersion') ?: '93fde537c7').toString()
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
    mindustryModsDir = file((project.findProperty('mindustryModsDir') ?: "${System.properties['user.home']}/AppData/Roaming/Mindustry/mods").toString())
}

def modMetadataFile = file("assets/mod.json")
if (!modMetadataFile.exists()) {
    throw new GradleException("Missing mod metadata file: $modMetadataFile")
}

def modMetadata = new JsonSlurper().parse(modMetadataFile)
def modVersion = (modMetadata.version ?: project.version).toString()
def artifactBaseName = (project.findProperty('modArtifact') ?: project.name).toString()
def serverArtifactBaseName = (project.findProperty('serverArtifact') ?: "${artifactBaseName}Server").toString()

def copyArtifactToMindustryMods = { File artifact ->
    if(!mindustryModsDir.exists() && !mindustryModsDir.mkdirs()){
        throw new GradleException("Failed to create Mindustry mods directory: $mindustryModsDir")
    }

    copy{
        from artifact
        into mindustryModsDir
    }

    logger.lifecycle("Copied ${artifact.name} to ${mindustryModsDir}")
}

//java 8 backwards compatibility flag
allprojects{
    tasks.withType(JavaCompile).tap{
        configureEach{
            options.compilerArgs.addAll(['--release', '8'])
        }
    }
}

dependencies{
    def useLatest = false //set to "true" to always depend on the newest version of mindustry

    implementation 'org.jetbrains:annotations:24.0.1'
    compileOnly useLatest ? "Anuken:MindustryBuilds:latest" : "Anuken:Mindustry:$mindustryVersion"

    annotationProcessor "com.github.Anuken:jabel:$jabelVersion"
}

tasks.register('jarAndroid'){
    dependsOn "jar"

    doLast{
        if(!sdkRoot || !new File(sdkRoot).exists()) throw new GradleException("No valid Android SDK found. Ensure that ANDROID_HOME is set to your Android SDK directory.")

        def platformRoot = new File("$sdkRoot/platforms/").listFiles().sort().reverse().find{ f -> new File(f, "android.jar").exists() }

        if(!platformRoot) throw new GradleException("No android.jar found. Ensure that you have an Android platform installed.")

        //collect dependencies needed for desugaring
        def dependencies = (configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList() + [new File(platformRoot, "android.jar")]).collect{ "--classpath $it.path" }.join(" ")

        def d8 = isWindows ? "d8.bat" : "d8"

        //dex and desugar files - this requires d8 in your PATH
        "$d8 $dependencies --min-api 14 --output ${artifactBaseName}Android.jar ${artifactBaseName}Desktop.jar"
                .execute(null, new File("build/libs")).waitForProcessOutput(System.out, System.err)
    }
}

jar{
    archiveFileName = "${artifactBaseName}Desktop.jar"

    from{
        configurations.runtimeClasspath.collect{ it.isDirectory() ? it : zipTree(it) }
    }

    from(projectDir){
        include "mod.hjson"
    }

    from("assets/"){
        include "**"
    }

    doLast{
        copyArtifactToMindustryMods(archiveFile.get().asFile)
    }
}

tasks.register('deploy', Jar){
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "${artifactBaseName}-${modVersion}.jar"

    from { [zipTree("build/libs/${artifactBaseName}Desktop.jar"), zipTree("build/libs/${artifactBaseName}Android.jar")] }

    doLast{
        delete{
            delete "build/libs/${artifactBaseName}Android.jar"
        }
    }
}

tasks.register('serverDeploy', Copy) {
    dependsOn deploy
    def sourceJar = layout.buildDirectory.file("libs/${artifactBaseName}-${modVersion}.jar")
    def targetJarName = "${serverArtifactBaseName}-${modVersion}.jar"

    from(sourceJar)
    into(layout.buildDirectory.dir("libs"))
    rename { targetJarName }

    doLast {
        if (sourceJar.get().asFile.name != targetJarName) {
            project.delete(sourceJar.get().asFile)
        }
    }
}
